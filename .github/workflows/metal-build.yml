name: C2ME Metal Backend Build

on:
  workflow_dispatch:
  # Feature branches are covered by pull_request. Keep direct push CI for the
  # integration branch without enqueueing a duplicate Metal matrix for PR pushes.
  push:
    branches:
      - dev/26.2.0
    paths:
      - 'c2me-opts-accel-metal/**'
      - 'c2me-opts-accel-opencl/**'
      - 'c2me-opts-dfc/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/metal-build.yml'
  pull_request:
    paths:
      - 'c2me-opts-accel-metal/**'
      - 'c2me-opts-accel-opencl/**'
      - 'c2me-opts-dfc/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/metal-build.yml'

concurrency:
  group: metal-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  compile-shared-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          java-package: jdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Compile shared DFC, OpenCL and Metal Java ABI
        # OpenCL consumes c2me-opts-natives-math through its namedElements jar.
        # That module's processResources task packages every CMake target and is
        # unrelated to this Java ABI check, so skip only native resource packaging.
        run: >-
          ./gradlew
          :c2me-opts-dfc:compileJava
          :c2me-opts-accel-opencl:compileJava
          :c2me-opts-accel-metal:compileJava
          -x :c2me-opts-natives-math:processResources
          --no-daemon
          --stacktrace
        env:
          GPR_MAVEN_USER: ${{ github.actor }}
          GPR_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compile-metal:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          java-package: jdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Compile Metal backend
        run: ./gradlew :c2me-opts-accel-metal:compileJava --no-daemon --stacktrace
        env:
          GPR_MAVEN_USER: ${{ github.actor }}
          GPR_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
