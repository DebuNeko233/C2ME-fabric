name: C2ME Metal Backend Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'c2me-opts-accel-metal/**'
      - 'c2me-opts-accel-opencl/**'
      - 'c2me-opts-dfc/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/metal-build.yml'
  pull_request:
    paths:
      - 'c2me-opts-accel-metal/**'
      - 'c2me-opts-accel-opencl/**'
      - 'c2me-opts-dfc/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/metal-build.yml'

concurrency:
  group: metal-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  compile-shared-abi:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          java-package: jdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Compile shared DFC, OpenCL and Metal Java paths
        run: ./gradlew :c2me-opts-dfc:compileJava :c2me-opts-accel-opencl:compileJava :c2me-opts-accel-metal:compileJava --stacktrace
        env:
          GPR_MAVEN_USER: ${{ github.actor }}
          GPR_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compile-metal:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          java-package: jdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Compile Metal backend
        run: ./gradlew :c2me-opts-accel-metal:compileJava --stacktrace
        env:
          GPR_MAVEN_USER: ${{ github.actor }}
          GPR_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
