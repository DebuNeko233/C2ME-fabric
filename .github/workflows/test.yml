name: C2ME Test

on:
  # Full Minecraft server tests are expensive. Do not run them for every PR
  # synchronize event; normal PR pushes are covered by Build/Metal compile CI.
  # Run the server suite automatically only after changes reach the integration
  # branch, or explicitly when a full runtime check is needed.
  workflow_dispatch:
  push:
    branches:
      - dev/26.2.0
    paths:
      - 'c2me-*/src/main/**'
      - 'tests/test-mod/src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/test.yml'

concurrency:
  group: test-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  packages: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        testTask: [runTestC2MEServer, runProductionTestC2MEServer]

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: true

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 25
        java-package: jdk

    - name: Install LLVM
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: "20.1.8"
        force-url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-Linux-X64.tar.xz"
        directory: ${{ runner.temp }}/llvm

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
        cache-cleanup: never

    - name: Test C2ME
      shell: bash
      run: |
        set +e
        timeout --signal=TERM --kill-after=30s 20m \
          ./gradlew clean "${{ matrix.testTask }}" --no-daemon --stacktrace
        status=$?
        set -e
        if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
          echo "::error::${{ matrix.testTask }} exceeded the 20-minute process watchdog"
        fi
        exit "$status"
      env:
        GPR_MAVEN_USER: ${{ github.actor }}
        GPR_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
